[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "transitive"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = """\
    Marvin attack timing sidechannel in rsa 0.9 private-key decryption. No patched \
    0.9 release exists. neotales-x509 uses rsa for key parsing and signatures, not \
    for that decrypt path. neotales-age's private RSA decrypt goes through \
    sad_rsa decrypt_blinded, and this is not a mitigation. This is not a mitigation. Delete this entry when rsa \
    leaves the graph or the crate moves to a patched line.""" },
  { id = "RUSTSEC-2024-0449", reason = """\
    unsafe-libyaml is unmaintained. No patched release exists. \
    neotales-docker-compose uses serde_yaml 0.9, and its YAML output and tests were \
    written against that parser. Replacing it is not this import. This is not a \
    mitigation. Delete this entry when that parser leaves the graph.""" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
