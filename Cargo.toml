[workspace]
resolver = "3"
members = ["std/args", "std/dotenv", "std/env", "templates/sprig"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/neotales/rs-lib"
authors = ["Neotales"]

[workspace.dependencies]
indexmap = { version = "2.12", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
