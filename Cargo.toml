[workspace]
resolver = "3"
members = [
  "std/args",
  "std/dotenv",
  "std/env",
  "os/process",
  "docker/buildkit",
  "templates/sprig",
  "templates/gotmpl",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/neotales/rs-lib"
authors = ["Neotales"]

[workspace.dependencies]
indexmap = { version = "2.12", features = ["serde"] }
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }
tempfile = "3.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt", "sync", "time"] }
url = "2.5"
zeroize = { version = "1.9", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
