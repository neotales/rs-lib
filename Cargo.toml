[workspace]
resolver = "3"
members = [
  "std/args",
  "std/dotenv",
  "std/env",
  "os/process",
  "docker/bake",
  "docker/compose",
  "docker/buildkit",
  "docker/oci",
  "docker/engine",
  "crypto/keepass",
  "crypto/keepass-platform",
  "crypto/x509",
  "ssh/ssh",
  "crypto/age",
  "templates/sprig",
  "templates/gotmpl",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/neotales/rs-lib"
authors = ["Neotales"]

[workspace.dependencies]
bollard = { version = "=0.21.1", default-features = false, features = ["http", "pipe"] }
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1.3", features = ["client", "http1"] }
hyper-util = { version = "0.1.5", features = ["client-legacy", "http1", "tokio"] }
openssh = { version = "0.11.5", default-features = false, features = ["process-mux"] }
tar = "0.4"
tokio-util = { version = "0.7", features = ["codec"] }
tower-service = "0.3"
zip = { version = "9", default-features = false, features = ["deflate"] }
aes-gcm = "0.11.1"
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
poly1305 = "0.9.1"
chacha20poly1305 = { version = "0.11", features = ["reduced-round"] }
des = { version = "0.9.0", features = ["zeroize"] }
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["sys_rng"] }
hkdf = "0.13.0"
hpke = { version = "0.14.1", features = ["nistp"] }
md-5 = "0.11.0"
sad-rsa = { version = "0.10.2", features = ["std"] }
scrypt = "0.12.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
aes = "0.9.2"
argon2 = "0.6.0"
base64 = "0.22"
blowfish = { version = "0.10.0", features = ["bcrypt"] }
ctr = "0.10.1"
ed25519-dalek = { version = "3.0.0", features = ["alloc", "pkcs8"] }
p256 = "0.14.0"
p384 = "0.14.0"
p521 = "0.14.0"
rcgen = { version = "0.14.7", features = ["zeroize"] }
rsa = "0.9.10"
subtle = "2.6.1"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
chacha20 = { version = "0.10.2", features = ["cipher", "legacy", "xchacha"] }
flate2 = "1.1"
getrandom = "0.3"
hmac = "0.13.0"
indexmap = { version = "2.12", features = ["serde"] }
quick-xml = "0.42"
salsa20 = "0.11"
sha1 = "0.11.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }
tempfile = "3.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.47", features = ["macros", "rt", "sync", "time"] }
url = "2.5"
# 1.9.1 redacts `Zeroizing`'s Debug output. neotales-keepass was tested against
# 1.9.0, and its hand-written Debug impl exists because that version prints the
# wrapped secret. Do not float this until that impl is revisited.
zeroize = { version = "=1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
