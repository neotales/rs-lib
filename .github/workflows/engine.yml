name: engine

# The oci pipeline. It builds only this group, never the workspace.
# Today that is neotales-docker.

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "docker/engine/**"
      - "fixtures/docker/engine/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".github/workflows/engine.yml"
      - ".github/actions/setup-rust/**"
  pull_request:
    paths:
      - "docker/engine/**"
      - "fixtures/docker/engine/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".github/workflows/engine.yml"
      - ".github/actions/setup-rust/**"

permissions:
  contents: read

concurrency:
  group: oci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: engine

      - name: Format
        run: cargo fmt -p neotales-docker -- --check

      - name: Clippy
        run: cargo clippy -p neotales-docker --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test -p neotales-docker --all-targets --all-features

      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p neotales-docker --all-features --no-deps

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: engine-msrv

      - name: Test on the pinned compiler
        run: cargo test -p neotales-docker --all-targets --all-features
